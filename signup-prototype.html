<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>福委會活動報名</title>
  <style>
    :root {
      --bg:        #fdf8dc;   /* 鵝黃底色 */
      --card:      #fffef4;   /* 卡片 — 暖白帶黃 */
      --border:    #e8dfa8;   /* 邊框 — 偏黃金 */
      --text:      #3a3020;   /* 深棕文字 */
      --text-light:#9a8860;
      --input-bg:  #fffef8;
      --success:   #3a7040;
      --success-bg:#eef6e8;
      --error:     #b83030;
      --error-bg:  #fdf0f0;

      /* 三個活動的色系（配鵝黃底） */
      --c-cal:     #4a7a3a;   /* 己書藝術 — 草綠 */
      --c-cal-bg:  #eef6e8;
      --c-cake:    #c0604a;   /* DIY蛋糕 — 陶土橘 */
      --c-cake-bg: #fdf2ee;
      --c-esc:     #5a4890;   /* 密室逃脫 — 深靛紫 */
      --c-esc-bg:  #f0edf8;
    }

    html { font-size: 18px; }  /* 基準放大：0.88rem ≈ 16px ≈ 12pt */

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px 64px;
    }

    /* ── Header ── */
    .page-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .page-header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -.01em;
    }
    .page-header p {
      color: #888;
      font-size: 0.88rem;
    }

    /* ── Card ── */
    .form-card {
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(0,0,0,.07);
      padding: 28px 24px;
      width: 100%;
      max-width: 640px;
      margin-bottom: 14px;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #aaa;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    /* ── Activity cards ── */
    .activity-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .activity-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px 8px 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .12s;
      position: relative;
      user-select: none;
    }
    .activity-card:hover { transform: translateY(-1px); }
    .activity-card input[type=radio] { display: none; }

    .activity-card.selected-cal  { border-color: var(--c-cal);  background: var(--c-cal-bg); }
    .activity-card.selected-cake { border-color: var(--c-cake); background: var(--c-cake-bg); }
    .activity-card.selected-esc  { border-color: var(--c-esc);  background: var(--c-esc-bg); }

    .check-badge {
      display: none;
      position: absolute;
      top: 8px; right: 9px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .activity-card.selected-cal  .check-badge { display: block; color: var(--c-cal); }
    .activity-card.selected-cake .check-badge { display: block; color: var(--c-cake); }
    .activity-card.selected-esc  .check-badge { display: block; color: var(--c-esc); }

    .act-icon { font-size: 2rem; display: block; margin-bottom: 8px; }
    .act-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    /* ── Slot section (hidden until activity chosen) ── */
    .slots-section { display: none; }
    .slots-section.visible { display: block; }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .slot-card {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      position: relative;
      user-select: none;
    }
    .slot-card input[type=radio] { display: none; }
    .slot-card.full  { opacity: .48; cursor: not-allowed; }

    .slot-card.selected { border-color: var(--slot-color); background: var(--slot-bg); }
    .slot-card:not(.full):hover { border-color: var(--slot-color); }

    .slot-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 3px;
    }
    .slot-datetime {
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .slot-quota {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      color: #666;
    }
    .quota-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #55b872;
      flex-shrink: 0;
    }
    .quota-dot.full { background: #e07070; }

    /* ── Info section ── */
    .info-section { display: none; }
    .info-section.visible { display: block; }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .field-group { margin-bottom: 14px; }
    .field-group:last-child { margin-bottom: 0; }

    label.field-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
    }
    label.field-label .req { color: #c03030; margin-left: 2px; }

    input[type=text], select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: inherit;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: #aaa; }
    input::placeholder, textarea::placeholder { color: #bbb; }
    select option[value=""] { color: #bbb; }

    textarea { resize: vertical; min-height: 68px; }

    /* ── Submit ── */
    .submit-btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .18s;
      letter-spacing: .01em;
    }
    .submit-btn:disabled { opacity: .35; cursor: not-allowed; }
    .submit-btn:not(:disabled):hover { opacity: .8; }

    /* ── Message ── */
    .msg-box {
      display: none;
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 9px;
      font-size: 0.87rem;
      line-height: 1.5;
    }
    .msg-box.success { display: block; background: var(--success-bg); color: var(--success); }
    .msg-box.error   { display: block; background: var(--error-bg);   color: var(--error); }

    /* ── Footer ── */
    .page-footer {
      font-size: 0.78rem;
      color: #aaa;
      text-align: center;
      max-width: 640px;
    }

    /* ── RWD ── */
    @media (max-width: 500px) {
      .activity-grid { grid-template-columns: 1fr; }
      .field-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 380px) {
      .form-card { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <h1>福委會活動報名</h1>
  <p>每人限報一個活動一個梯次 · 先報先得</p>
</div>

<div class="form-card">

  <!-- ① 選擇活動 -->
  <div class="section-label">① 選擇活動</div>
  <div class="activity-grid">

    <label class="activity-card" id="card-calligraphy" onclick="selectActivity('calligraphy')">
      <input type="radio" name="activity" value="calligraphy">
      <span class="check-badge">✓</span>
      <span class="act-icon">🖌️</span>
      <div class="act-name">己書藝術</div>
    </label>

    <label class="activity-card" id="card-cake" onclick="selectActivity('cake')">
      <input type="radio" name="activity" value="cake">
      <span class="check-badge">✓</span>
      <span class="act-icon">🎂</span>
      <div class="act-name">DIY 手作蛋糕</div>
    </label>

    <label class="activity-card" id="card-escape" onclick="selectActivity('escape')">
      <input type="radio" name="activity" value="escape">
      <span class="check-badge">✓</span>
      <span class="act-icon">🔐</span>
      <div class="act-name">密室逃脫</div>
    </label>

  </div>

  <!-- ② 選擇梯次 -->
  <div class="slots-section" id="slotsSection">
    <hr class="divider">
    <div class="section-label">② 選擇梯次</div>
    <div class="slots-grid" id="slotsGrid">
      <!-- rendered by JS -->
    </div>
  </div>

  <!-- ③ 填寫資料 -->
  <div class="info-section" id="infoSection">
    <hr class="divider">
    <div class="section-label">③ 填寫資料</div>

    <form id="signupForm" onsubmit="handleSubmit(event)">
      <div class="field-row">
        <div class="field-group">
          <label class="field-label" for="name">姓名 <span class="req">*</span></label>
          <input type="text" id="name" placeholder="請輸入全名" required>
        </div>
        <div class="field-group">
          <label class="field-label" for="empId">員工編號 <span class="req">*</span></label>
          <input type="text" id="empId" placeholder="請輸入員工編號" required>
        </div>
      </div>

      <div class="field-row" id="divDeptRow">
        <div class="field-group">
          <label class="field-label" for="division">事業處 <span class="req">*</span></label>
          <select id="division" required onchange="updateDept()">
            <option value="">— 請選擇 —</option>
            <option>銀行事業處</option>
            <option>系統整合處</option>
            <option>技術研發處</option>
            <option>行政管理處</option>
            <option>企業事業處</option>
          </select>
        </div>
        <div class="field-group" id="deptGroup">
          <label class="field-label" for="department">部門 <span class="req">*</span></label>
          <select id="department" required>
            <option value="">— 請先選事業處 —</option>
          </select>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="note">備註</label>
        <textarea id="note" placeholder="如有特殊需求請填寫（選填）"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn" disabled>請先選擇活動與梯次</button>
    </form>

    <div class="msg-box" id="msgBox"></div>
  </div>

</div>

<div class="page-footer">
  <p style="margin-bottom:6px;">注意事項</p>
  <p>· 額滿梯次將顯示「額滿」並關閉選擇</p>
  <p>· 如需取消或更改梯次，請聯繫福委群</p>
</div>

<script>
// ================================================================
// ⚙️  Config — 活動資料（梯次確認後更新這裡）
// ================================================================
const POST_URL = 'https://default71f032078cd347c2bc88ec47bf164d.43.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/4e4f1306bfaa41be95b3a2f3304f40d4/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GgpZ-c1cIfUfOQ5-xdikySFw-DkE-Ku6IDKTLc2lHnU';
const GET_URL  = 'https://default71f032078cd347c2bc88ec47bf164d.43.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/996f6c1e92ee4ec48485d0a9414e840c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=t8p4V9ion384gMRTS-2p6GIzmbnHAkbL9q6smGPdrfY';

const ACTIVITIES = {
  calligraphy: {
    name:       '己書藝術',
    cssClass:   'selected-cal',
    slotColor:  'var(--c-cal)',
    slotBg:     'var(--c-cal-bg)',
    maxPerSlot: 3,
    slots: [
      { id: 'c1', name: '梯次一', date: '待確認', time: '待確認' },
      { id: 'c2', name: '梯次二', date: '待確認', time: '待確認' },
    ],
  },
  cake: {
    name:       'DIY手作蛋糕',
    cssClass:   'selected-cake',
    slotColor:  'var(--c-cake)',
    slotBg:     'var(--c-cake-bg)',
    maxPerSlot: 4,
    slots: [
      { id: 'k1', name: '梯次一', date: '待確認', time: '待確認' },
    ],
  },
  escape: {
    name:       '密室逃脫',
    cssClass:   'selected-esc',
    slotColor:  'var(--c-esc)',
    slotBg:     'var(--c-esc-bg)',
    maxPerSlot: 4,
    slots: [
      { id: 'e1', name: '梯次一', date: '待確認', time: '待確認' },
      { id: 'e2', name: '梯次二', date: '待確認', time: '待確認' },
    ],
  },
};

const DEPT_MAP = {
  '銀行事業處': ['業務發展部', '數位支付部', '網路事業部', '應用發展部', '海外金融部'],
  '系統整合處': ['業務一部', '技術支援部'],
  '技術研發處': [],
  '行政管理處': [],
  '企業事業處': ['電子商務部', '永續發展部', '流通事業部', '保險科技部', '數據加值部', '事業推展部'],
};

// ================================================================
// State
// ================================================================
let selectedActivity = null;
let selectedSlot     = null;
let quotaCounts      = {};

// slotLabel = '己書藝術/梯次一' (活動名/梯次名)
function slotLabel(actKey, slotName) {
  return `${ACTIVITIES[actKey].name}/${slotName}`;
}

// ================================================================
// Activity selection
// ================================================================
function selectActivity(actKey) {
  // deselect all cards
  Object.keys(ACTIVITIES).forEach(k => {
    const card = document.getElementById(`card-${k}`);
    card.classList.remove('selected-cal', 'selected-cake', 'selected-esc');
    card.querySelector('input').checked = false;
  });

  // select this card
  const card = document.getElementById(`card-${actKey}`);
  card.querySelector('input').checked = true;
  card.classList.add(ACTIVITIES[actKey].cssClass);

  selectedActivity = actKey;
  selectedSlot = null;

  // update slot section colors
  const sec = document.getElementById('slotsSection');
  sec.style.setProperty('--slot-color', ACTIVITIES[actKey].slotColor);
  sec.style.setProperty('--slot-bg',    ACTIVITIES[actKey].slotBg);

  // render + show
  renderSlots();
  sec.classList.add('visible');
  document.getElementById('infoSection').classList.add('visible');
  updateSubmitBtn();
}

// ================================================================
// Render slots
// ================================================================
function renderSlots() {
  if (!selectedActivity) return;
  const act  = ACTIVITIES[selectedActivity];
  const grid = document.getElementById('slotsGrid');

  grid.innerHTML = act.slots.map(slot => {
    const label    = slotLabel(selectedActivity, slot.name);
    const count    = quotaCounts[label] || 0;
    const remaining = act.maxPerSlot - count;
    const isFull   = remaining <= 0;
    const isChosen = selectedSlot === label;

    return `
      <label class="slot-card ${isFull ? 'full' : ''} ${isChosen ? 'selected' : ''}"
             data-label="${label}"
             onclick="${isFull ? '' : `pickSlot(this, '${label}')`}">
        <input type="radio" name="slot" value="${label}" ${isFull ? 'disabled' : ''}>
        <div class="slot-name">${slot.name}</div>
        <div class="slot-datetime">${slot.date}<br>${slot.time}</div>
        <div class="slot-quota">
          <span class="quota-dot ${isFull ? 'full' : ''}"></span>
          ${isFull ? '名額已滿' : `剩餘 ${remaining} 名`}
        </div>
      </label>`;
  }).join('');
}

function pickSlot(el, label) {
  document.querySelectorAll('.slot-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedSlot = label;
  updateSubmitBtn();
}

// ================================================================
// Submit button state
// ================================================================
function updateSubmitBtn() {
  const btn = document.getElementById('submitBtn');
  if (!selectedActivity) {
    btn.disabled = true;
    btn.textContent = '請先選擇活動與梯次';
  } else if (!selectedSlot) {
    btn.disabled = true;
    btn.textContent = '請選擇梯次';
  } else {
    btn.disabled = false;
    btn.textContent = '確認報名';
  }
}

// ================================================================
// Dept map
// ================================================================
function updateDept() {
  const div   = document.getElementById('division').value;
  const depts = DEPT_MAP[div] || [];
  const dep   = document.getElementById('department');
  const grp   = document.getElementById('deptGroup');

  const row = document.getElementById('divDeptRow');
  if (depts.length) {
    dep.innerHTML = '<option value="">— 請選擇部門 —</option>'
      + depts.map(d => `<option>${d}</option>`).join('');
    dep.required = true;
    grp.style.display = '';
    row.style.gridTemplateColumns = '';   // 恢復兩欄
  } else {
    dep.innerHTML = '<option value=""></option>';
    dep.required  = false;
    grp.style.display = 'none';
    row.style.gridTemplateColumns = '1fr'; // 事業處獨佔一欄
  }
}

// ================================================================
// fetchCounts — silent background polling
// ================================================================
async function fetchCounts(isBackground = false) {
  try {
    const res  = await fetch(GET_URL + '&_t=' + Date.now(), { method: 'POST' });
    const json = await res.json();
    if (JSON.stringify(json) !== JSON.stringify(quotaCounts)) {
      quotaCounts = json;
      if (selectedActivity) renderSlots();
    }
  } catch {
    // silent fail on background; first-load errors handled in renderSlots placeholder
  }
}

// ================================================================
// Submit
// ================================================================
async function handleSubmit(e) {
  e.preventDefault();
  if (!selectedActivity || !selectedSlot) return;

  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msgBox');
  msg.className = 'msg-box';
  btn.disabled  = true;
  btn.textContent = '送出中…';

  try {
    const res = await fetch(POST_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        activity:   ACTIVITIES[selectedActivity].name,
        slot:       selectedSlot,
        name:       document.getElementById('name').value.trim(),
        empId:      document.getElementById('empId').value.trim(),
        division:   document.getElementById('division').value,
        department: document.getElementById('department').value,
        note:       document.getElementById('note').value.trim(),
      }),
    });

    const data = await res.json();

    if (data.status === 'ok') {
      msg.className   = 'msg-box success';
      msg.textContent = `✅ 報名成功！已登記「${ACTIVITIES[selectedActivity].name} — ${selectedSlot.split('/')[1]}」`;
      e.target.reset();
      // reset UI
      selectedActivity = null;
      selectedSlot     = null;
      Object.keys(ACTIVITIES).forEach(k =>
        document.getElementById(`card-${k}`).classList.remove('selected-cal','selected-cake','selected-esc')
      );
      document.getElementById('slotsSection').classList.remove('visible');
      document.getElementById('infoSection').classList.remove('visible');
      fetchCounts(true);
    } else if (data.status === 'duplicate') {
      msg.className   = 'msg-box error';
      msg.textContent = '⚠️ 您已報名過活動，每人限報一次。';
      btn.disabled    = false;
      btn.textContent = '確認報名';
    } else {
      throw new Error();
    }
  } catch {
    msg.className   = 'msg-box error';
    msg.textContent = '送出失敗，請稍後再試。';
    btn.disabled    = false;
    btn.textContent = '確認報名';
  }
}

// ================================================================
// Init
// ================================================================
fetchCounts(false);
setInterval(() => fetchCounts(true), 30000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') fetchCounts(true);
});
</script>

</body>
</html>
