<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>福委會活動報名</title>
  <style>
    :root {
      --bg:        #ede5d8;
      --card:      #f8f1e6;
      --border:    #cdb890;
      --text:      #5a3c28;
      --text-light:#9a7860;
      --input-bg:  #fdf8f0;
      --success:   #4a7040;
      --success-bg:#eaf2e2;
      --error:     #b03030;
      --error-bg:  #fdf0ee;

      --c-cal:     #6b8050;
      --c-cal-bg:  #ecf0e4;
      --c-cake:    #b06048;
      --c-cake-bg: #f5ece6;
      --c-esc:     #7060a0;
      --c-esc-bg:  #eeeaf4;
    }

    html { font-size: 18px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px 64px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .page-header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .page-header p { color: #555; font-size: 0.88rem; }

    .form-card {
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(0,0,0,.07);
      padding: 28px 24px;
      width: 100%;
      max-width: 640px;
      margin-bottom: 14px;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #b09878;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    /* ── Activity section ── */
    .activity-section { margin-bottom: 22px; }
    .activity-section:last-child { margin-bottom: 0; }

    .act-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      padding-bottom: 9px;
      margin-bottom: 12px;
      border-bottom: 2px solid;
    }
    .act-header.cal  { color: var(--c-cal);  border-color: var(--c-cal); }
    .act-header.cake { color: var(--c-cake); border-color: var(--c-cake); }
    .act-header.esc  { color: var(--c-esc);  border-color: var(--c-esc); }
    .act-icon-sm { font-size: 1.1rem; }

    /* ── Slot grid ── */
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .slot-card {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .slot-card.full { opacity: .45; cursor: not-allowed; }
    .slot-card.selected {
      border-color: var(--slot-color);
      background: var(--slot-bg);
    }
    .slot-card:not(.full):hover { border-color: var(--slot-color); }

    .slot-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 3px;
    }
    .slot-datetime {
      font-size: 0.78rem;
      color: #a08868;
      margin-bottom: 10px;
    }
    .slot-quota {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      color: #907058;
    }
    .quota-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #78a870;
      flex-shrink: 0;
    }
    .quota-dot.full { background: #c07070; }

    /* ── Waitlist section ── */
    .waitlist-section {
      margin: 0;
    }
    .waitlist-toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    .waitlist-toggle-row input[type=checkbox] {
      width: 15px; height: 15px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .waitlist-body {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .waitlist-select-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 500px) { .waitlist-select-row { grid-template-columns: 1fr; } }

    /* ── Companion toggle (inside selected slot card) ── */
    .companion-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.73rem;
      color: var(--text-light);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(0,0,0,0.28);
      cursor: pointer;
      user-select: none;
    }
    .companion-label input[type=checkbox] {
      width: 14px; height: 14px;
      accent-color: var(--slot-color, var(--text));
      cursor: pointer;
      flex-shrink: 0;
    }
    .companion-label.cp-disabled {
      opacity: .4;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* ── Form fields ── */
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .field-group { margin-bottom: 14px; }
    .field-group:last-child { margin-bottom: 0; }

    label.field-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
    }
    label.field-label .req { color: #c03030; margin-left: 2px; }

    input[type=text], select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: inherit;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: #aaa; }
    input::placeholder, textarea::placeholder { color: #bbb; }
    textarea { resize: vertical; min-height: 68px; }

    .ack-label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 0.88rem;
      color: var(--text);
      cursor: pointer;
      line-height: 1.5;
    }
    .ack-label input[type=checkbox] {
      width: 16px; height: 16px;
      margin-top: 2px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .18s;
      letter-spacing: .01em;
    }
    .submit-btn:disabled { opacity: .35; cursor: not-allowed; }
    .submit-btn:not(:disabled):hover { opacity: .8; }

    .msg-box {
      display: none;
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 9px;
      font-size: 0.87rem;
      line-height: 1.5;
    }
    .msg-box.success { display: block; background: var(--success-bg); color: var(--success); }
    .msg-box.error   { display: block; background: var(--error-bg);   color: var(--error); }

    .page-footer {
      font-size: 0.78rem;
      color: #aaa;
      text-align: center;
      max-width: 640px;
    }

    /* ── Activity location ── */
    .act-location {
      font-size: 0.75rem;
      font-weight: 400;
      color: #5a3c28;
      margin-left: auto;
    }

    /* ── Notice box ── */
    .notice-box {
      background: #f5ede0;
      border: 1px solid #cdb890;
      border-left: 4px solid #a87850;
      border-radius: 8px;
      padding: 13px 16px;
      margin: 14px 0 18px;
      font-size: 0.82rem;
      line-height: 1.65;
      color: #6a4830;
    }
    .notice-title {
      font-weight: 700;
      color: #7a5030;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }
    .notice-box ul {
      margin: 0;
      padding-left: 18px;
    }
    .notice-box li + li { margin-top: 6px; }

    @media (max-width: 500px) {
      .field-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 380px) {
      .form-card { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <h1>福委會活動報名</h1>
</div>

<div class="form-card">

  <!-- ① 選擇梯次 -->
  <div class="section-label">① 選擇梯次</div>
  <p style="font-size:0.8rem;color:#555;margin:4px 0 10px;"> 單次限報一個活動一個梯次 · 先報先得</p>
  <div id="allSlotsContainer">
    <!-- rendered by JS -->
  </div>

  <hr class="divider">

  <!-- 候補登記 -->
  <div class="waitlist-section">
    <label class="waitlist-toggle-row">
      <input type="checkbox" id="waitlistCheck" onchange="onWaitlistToggle()">
      額滿登記候補
    </label>
    <div id="waitlistBody" style="display:none;" class="waitlist-body">
      <div class="waitlist-select-row">
        <div>
          <label class="field-label" style="margin-bottom:4px;">活動項目</label>
          <select id="waitlistActivity" onchange="onWaitlistActivityChange()">
            <option value="">— 選擇活動 —</option>
          </select>
        </div>
        <div>
          <label class="field-label" style="margin-bottom:4px;">梯次</label>
          <select id="waitlistSlot" onchange="onWaitlistSlotChange()">
            <option value="">— 選擇梯次 —</option>
          </select>
        </div>
      </div>
      <div id="waitlistCompanion" style="display:none;">
        <label class="companion-label" style="border-top:none;padding-top:0;">
          <input type="checkbox" id="waitlistCompanionCheck"
            onchange="selectedCompanion=this.checked; updateSubmitBtn();">
          攜伴 +1
        </label>
      </div>
      <p style="font-size:0.78rem;color:#555;font-weight:600;margin:4px 0 0;">視場地與活動性質，福委評估是否可多容納人數或加開梯次後回覆。</p>
    </div>
  </div>

  <hr class="divider">

  <!-- ② 填寫資料 -->
  <div class="section-label">② 填寫資料</div>
  <form id="signupForm" onsubmit="handleSubmit(event)">

    <div class="field-row">
      <div class="field-group">
        <label class="field-label" for="name">姓名 <span class="req">*</span></label>
        <input type="text" id="name" placeholder="請輸入全名" required>
      </div>
      <div class="field-group">
        <label class="field-label" for="empId">員工編號 <span class="req">*</span></label>
        <input type="text" id="empId" placeholder="請輸入員工編號" required>
      </div>
    </div>

    <div class="field-row" id="divDeptRow">
      <div class="field-group">
        <label class="field-label" for="division">事業處 <span class="req">*</span></label>
        <select id="division" required onchange="updateDept()">
          <option value="">— 請選擇 —</option>
          <option>銀行事業處</option>
          <option>系統整合處</option>
          <option>技術研發處</option>
          <option>行政管理處</option>
          <option>企業事業處</option>
        </select>
      </div>
      <div class="field-group" id="deptGroup">
        <label class="field-label" for="department">部門 <span class="req">*</span></label>
        <select id="department" required>
          <option value="">— 請先選事業處 —</option>
        </select>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label" for="note">備註</label>
      <p style="font-size:0.78rem;color:#555;margin:0 0 5px;">烘焙蛋糕體驗選擇平日場並攜伴者，請於備註欄填寫眷屬安排：「眷屬陪同」或「眷屬自費」。</p>
      <textarea id="note" placeholder="其他需求請填寫（選填）"></textarea>
    </div>

    <div class="notice-box">
      <div class="notice-title">❗ 注意事項</div>
      <ul>
        <li>額滿梯次將顯示「已額滿」並關閉選擇。</li>
        <li>有興趣自費報名其他項目的同仁，第二次以上登記請在員工編號末尾加上小寫英文字母第二次加「a」、第三次加「aa」，以此類推，(例：11003001a、11003001aa)，費用細節將由福委另行通知。</li>
        <li>若需取消或更改梯次，請聯繫福委群。</li>
      </ul>
    </div>

    <label class="ack-label">
      <input type="checkbox" id="ackCheck" onchange="updateSubmitBtn()">
      <span>我已知悉，若攜伴或報名第二次以上項目會有費用收取。 <span style="color:#c03030;">*</span></span>
    </label>

    <button type="submit" class="submit-btn" id="submitBtn" disabled>請先選擇梯次</button>
  </form>

  <div class="msg-box" id="msgBox"></div>
</div>


<script>
// ================================================================
// ⚙️  Config
// ================================================================
const POST_URL = 'https://default71f032078cd347c2bc88ec47bf164d.43.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/4e4f1306bfaa41be95b3a2f3304f40d4/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GgpZ-c1cIfUfOQ5-xdikySFw-DkE-Ku6IDKTLc2lHnU';
const GET_URL  = 'https://default71f032078cd347c2bc88ec47bf164d.43.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/996f6c1e92ee4ec48485d0a9414e840c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=t8p4V9ion384gMRTS-2p6GIzmbnHAkbL9q6smGPdrfY';

const ACTIVITIES = {
  calligraphy: {
    name:       '己書藝術',
    icon:       '🖌️🎨',
    cssClass:   'cal',
    slotColor:  'var(--c-cal)',
    slotBg:     'var(--c-cal-bg)',
    location:   '公司內部會議室 (801)',
    maxPerSlot: 3,
    slots: [
      { id: 'c1', name: '梯次一', date: '7/5',  time: '14:00', weekday: '(日)' },
      { id: 'c2', name: '梯次二', date: '7/12', time: '14:00', weekday: '(日)' },
    ],
  },
  cake: {
    name:       'DIY手作蛋糕',
    icon:       '🎂',
    cssClass:   'cake',
    slotColor:  'var(--c-cake)',
    slotBg:     'var(--c-cake-bg)',
    location:   '士林店或南京店，近捷運劍潭站／南京三民站，步行約 5－8 分鐘',
    maxPerSlot: 4,
    slots: [
      { id: 'k1', name: '梯次一', date: '7/19', time: '14:00', weekday: '(日)' },
      { id: 'k2', name: '梯次二', date: '7/26', time: '14:00', weekday: '(日)' },
      { id: 'k3', name: '梯次三', date: '8/2',  time: '14:00', weekday: '(日)' },
    ],
  },
  escape: {
    name:       '密室逃脫',
    icon:       '🕵️🔐',
    cssClass:   'esc',
    slotColor:  'var(--c-esc)',
    slotBg:     'var(--c-esc-bg)',
    location:   '近捷運南京三民站，步行約 6 分鐘',
    maxPerSlot: 4,
    slots: [
      { id: 'e1', name: '梯次一', date: '8/1',  time: '14:00', weekday: '(六)' },
      { id: 'e2', name: '梯次二', date: '8/8',  time: '14:00', weekday: '(六)' },
      { id: 'e3', name: '梯次三', date: '8/15', time: '14:00', weekday: '(六)' },
      { id: 'e4', name: '梯次四', date: '8/22', time: '14:00', weekday: '(六)' },
      { id: 'e5', name: '梯次五', date: '8/29', time: '14:00', weekday: '(六)' },
    ],
  },
};

const DEPT_MAP = {
  '銀行事業處': ['業務發展部', '數位支付部', '網路事業部', '應用發展部', '海外金融部'],
  '系統整合處': ['業務一部', '技術支援部'],
  '技術研發處': [],
  '行政管理處': [],
  '企業事業處': ['電子商務部', '永續發展部', '流通事業部', '保險科技部', '數據加值部', '事業推展部'],
};

// ================================================================
// State
// ================================================================
let selectedActivity  = null;
let selectedSlot      = null;
let selectedCompanion = false;
let selectedWaitlist  = false;   // true = 候補登記
let quotaCounts       = {};

// slot label: '梯次一 7/5 14:00 (日)'
function slotLabel(slot) {
  return `${slot.name} ${slot.date} ${slot.time} ${slot.weekday}`;
}

// ================================================================
// Render all activities + slots
// ================================================================
function renderAll() {
  const container = document.getElementById('allSlotsContainer');
  container.innerHTML = Object.entries(ACTIVITIES).map(([actKey, act]) => `
    <div class="activity-section">
      <div class="act-header ${act.cssClass}">
        <span class="act-icon-sm">${act.icon}</span>${act.name}
        <span class="act-location">📍 ${act.location}</span>
      </div>
      <div class="slots-grid" style="--slot-color:${act.slotColor};--slot-bg:${act.slotBg};">
        ${act.slots.map(slot => {
          const label               = slotLabel(slot);
          const count               = quotaCounts[label] || 0;
          const remaining           = act.maxPerSlot - count;
          const isFull              = remaining <= 0;
          const isChosen    = selectedSlot === label && !selectedWaitlist;
          const companionOk = remaining >= 2;
          return `
            <div class="slot-card${isFull ? ' full' : ''}${isChosen ? ' selected' : ''}"
                 onclick="${isFull ? '' : `pickSlot('${actKey}','${label}')`}">
              <div class="slot-name">${slot.name}</div>
              <div class="slot-datetime">${slot.date} ${slot.time} ${slot.weekday}</div>
              <div class="slot-quota">
                <span class="quota-dot${isFull ? ' full' : ''}"></span>
                ${isFull ? '已額滿' : `剩餘 ${remaining} 名`}
              </div>
              ${isChosen ? `<label class="companion-label${companionOk ? '' : ' cp-disabled'}"
                  onclick="event.stopPropagation()">
                <input type="checkbox"
                  ${selectedCompanion ? 'checked' : ''}
                  ${companionOk ? '' : 'disabled'}
                  onchange="onCompanionChange('${actKey}','${label}',this.checked)">
                攜伴 +1${!companionOk ? '（名額不足）' : ''}
              </label>` : ''}
            </div>`;
        }).join('')}
      </div>
    </div>`
  ).join('');
}

function renderCompanion() {
  const sec = document.getElementById('companionSection');
  if (!sec) return;
  if (!selectedSlot || !selectedActivity) { sec.style.display = 'none'; return; }

  const act       = ACTIVITIES[selectedActivity];
  const count     = quotaCounts[selectedSlot] || 0;
  const remaining = act.maxPerSlot - count;
  const canBring  = remaining >= 2;

  sec.style.display = '';
  sec.innerHTML = `
    <div class="companion-section">
      <div class="companion-section-title">攜伴</div>
      <label class="companion-label${canBring ? '' : ' cp-disabled'}">
        <input type="checkbox"
          ${selectedCompanion ? 'checked' : ''}
          ${canBring ? '' : 'disabled'}
          onchange="onCompanionChange('${selectedActivity}','${selectedSlot}',this.checked)">
        攜伴 +1（佔用 2 個名額）
      </label>
      ${!canBring ? `<div class="companion-hint">⚠️ 此梯次剩餘名額不足，無法攜伴。</div>` : ''}
    </div>`;
}

function pickSlot(actKey, label) {
  if (selectedSlot !== label) selectedCompanion = false;
  selectedActivity = actKey;
  selectedSlot     = label;
  selectedWaitlist = false;
  // 清掉候補 checkbox
  const wc = document.getElementById('waitlistCheck');
  if (wc) { wc.checked = false; document.getElementById('waitlistBody').style.display = 'none'; }
  renderAll();
  updateSubmitBtn();
}

function pickWaitlist(actKey, label) {
  if (selectedSlot !== label) selectedCompanion = false;
  selectedActivity = actKey;
  selectedSlot     = label;
  selectedWaitlist = true;
  renderAll();
  updateSubmitBtn();
}

// ── Waitlist handlers ──
function onWaitlistToggle() {
  const checked = document.getElementById('waitlistCheck').checked;
  document.getElementById('waitlistBody').style.display = checked ? '' : 'none';
  if (checked) {
    // 清掉正常報名選擇，互斥
    selectedSlot      = null;
    selectedActivity  = null;
    selectedCompanion = false;
    selectedWaitlist  = true;
    renderAll();
    // 填入活動選項
    const actSel = document.getElementById('waitlistActivity');
    actSel.innerHTML = '<option value="">— 選擇活動 —</option>'
      + Object.entries(ACTIVITIES).map(([k,a]) => `<option value="${k}">${a.name}</option>`).join('');
    document.getElementById('waitlistSlot').innerHTML = '<option value="">— 選擇梯次 —</option>';
    document.getElementById('waitlistCompanion').style.display = 'none';
  } else {
    selectedWaitlist  = false;
    selectedActivity  = null;
    selectedSlot      = null;
    selectedCompanion = false;
    renderAll();
  }
  updateSubmitBtn();
}

function onWaitlistActivityChange() {
  const actKey = document.getElementById('waitlistActivity').value;
  const slotSel = document.getElementById('waitlistSlot');
  slotSel.innerHTML = '<option value="">— 選擇梯次 —</option>';
  document.getElementById('waitlistCompanion').style.display = 'none';
  selectedActivity  = null;
  selectedSlot      = null;
  if (!actKey) { updateSubmitBtn(); return; }
  const act = ACTIVITIES[actKey];
  const fullSlots = act.slots.filter(s => {
    const label = slotLabel(s);
    return (quotaCounts[label] || 0) >= act.maxPerSlot;
  });
  if (fullSlots.length === 0) {
    slotSel.innerHTML = '<option value="">（此活動目前尚有名額）</option>';
    updateSubmitBtn();
    return;
  }
  slotSel.innerHTML = '<option value="">— 選擇梯次 —</option>'
    + fullSlots.map(s => {
        const label = slotLabel(s);
        return `<option value="${actKey}|${label}">${label}</option>`;
      }).join('');
  updateSubmitBtn();
}

function onWaitlistSlotChange() {
  const val = document.getElementById('waitlistSlot').value;
  document.getElementById('waitlistCompanion').style.display = 'none';
  document.getElementById('waitlistCompanionCheck').checked = false;
  selectedCompanion = false;
  if (!val) { selectedActivity = null; selectedSlot = null; updateSubmitBtn(); return; }
  const [actKey, label] = val.split('|');
  selectedActivity = actKey;
  selectedSlot     = label;
  selectedWaitlist = true;
  document.getElementById('waitlistCompanion').style.display = '';
  updateSubmitBtn();
}

function onCompanionChange(actKey, label, checked) {
  selectedActivity  = actKey;
  selectedSlot      = label;
  selectedCompanion = checked;
  renderAll();
  updateSubmitBtn();
}

// ================================================================
// Submit button state
// ================================================================
function updateSubmitBtn() {
  const btn = document.getElementById('submitBtn');
  const ack = document.getElementById('ackCheck');
  if (!selectedSlot) {
    btn.disabled    = true;
    btn.textContent = '請先選擇梯次';
  } else if (!ack?.checked) {
    btn.disabled    = true;
    btn.textContent = '請先勾選下方確認項目';
  } else {
    btn.disabled    = false;
    btn.textContent = selectedWaitlist ? '確認候補登記' : '確認報名';
  }
}

// ================================================================
// Dept map
// ================================================================
function updateDept() {
  const div   = document.getElementById('division').value;
  const depts = DEPT_MAP[div] || [];
  const dep   = document.getElementById('department');
  const grp   = document.getElementById('deptGroup');
  const row   = document.getElementById('divDeptRow');

  if (depts.length) {
    dep.innerHTML = '<option value="">— 請選擇部門 —</option>'
      + depts.map(d => `<option>${d}</option>`).join('');
    dep.required = true;
    grp.style.display = '';
    row.style.gridTemplateColumns = '';
  } else {
    dep.innerHTML = '<option value=""></option>';
    dep.required  = false;
    grp.style.display = 'none';
    row.style.gridTemplateColumns = '1fr';
  }
}

// ================================================================
// fetchCounts — silent background polling
// ================================================================
async function fetchCounts() {
  try {
    const res  = await fetch(GET_URL + '&_t=' + Date.now(), { method: 'POST' });
    const json = await res.json();
    if (JSON.stringify(json) !== JSON.stringify(quotaCounts)) {
      quotaCounts = json;
      renderAll();
    }
  } catch { /* silent */ }
}

// ================================================================
// Submit
// ================================================================
async function handleSubmit(e) {
  e.preventDefault();
  if (!selectedActivity || !selectedSlot) return;

  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msgBox');
  msg.className   = 'msg-box';
  btn.disabled    = true;
  btn.textContent = '送出中…';

  try {
    await fetchCounts();
    const act         = ACTIVITIES[selectedActivity];
    const count       = quotaCounts[selectedSlot] || 0;
    const seatsNeeded = selectedCompanion ? 2 : 1;

    // 確認報名才做容量檢查；候補直接跳過
    if (!selectedWaitlist && count + seatsNeeded > act.maxPerSlot) {
      msg.className   = 'msg-box error';
      msg.textContent = (selectedCompanion && act.maxPerSlot - count === 1)
        ? '⚠️ 此梯次剩餘 1 個名額，無法攜伴，請取消攜伴或選擇其他梯次。'
        : '⚠️ 此梯次名額已滿，請選擇其他梯次。';
      btn.disabled    = false;
      btn.textContent = selectedWaitlist ? '確認候補登記' : '確認報名';
      return;
    }

    const res = await fetch(POST_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        activity:   act.name,
        slot:       selectedSlot,
        maxPerSlot: act.maxPerSlot,
        companion:  selectedCompanion,
        waitlist:   selectedWaitlist,
        name:       document.getElementById('name').value.trim(),
        empId:      document.getElementById('empId').value.trim(),
        division:   document.getElementById('division').value,
        department: document.getElementById('department').value,
        note:       document.getElementById('note').value.trim(),
      }),
    });

    let data = {};
    try { data = await res.json(); } catch { /* 回應非 JSON，維持空物件 */ }

    if (data.status === 'ok') {
      if (!selectedWaitlist) {
        // 確認報名：樂觀更新名額
        quotaCounts[selectedSlot] = (quotaCounts[selectedSlot] || 0) + (selectedCompanion ? 2 : 1);
      }
      msg.className   = 'msg-box success';
      msg.textContent = selectedWaitlist
        ? `📋 已登記候補！若可增加名額將由福委通知「${act.name} — ${selectedSlot}」`
        : `✅ 報名成功！已登記「${act.name} — ${selectedSlot}」`;
      e.target.reset();
      selectedActivity  = null;
      selectedSlot      = null;
      selectedCompanion = false;
      selectedWaitlist  = false;
      renderAll();
      updateSubmitBtn();
    } else if (data.status === 'full') {
      await fetchCounts(); // 重抓最新名額（攜伴時可能只是名額不足，未必真的全滿）
      renderAll();
      const freshRemaining = act.maxPerSlot - (quotaCounts[selectedSlot] || 0);
      msg.className   = 'msg-box error';
      msg.textContent = (selectedCompanion && freshRemaining === 1)
        ? '⚠️ 此梯次剩餘 1 個名額，無法攜伴，請取消攜伴或選擇其他梯次。'
        : '⚠️ 此梯次名額已滿，請選擇其他梯次。';
      btn.disabled    = false;
      btn.textContent = '確認報名';
    } else if (data.status === 'duplicate') {
      msg.className   = 'msg-box error';
      msg.textContent = '⚠️ 此員工編號已提交報名登記，不可重複報名，若有疑問請洽福委群。';
      btn.disabled    = false;
      btn.textContent = '確認報名';
    } else {
      // 非預期回應
      msg.className   = 'msg-box error';
      msg.textContent = '⚠️ 提交失敗，請稍後再試或聯絡福委群。';
      btn.disabled    = false;
      btn.textContent = '確認報名';
    }
  } catch {
    // 網路錯誤或 Power Automate 回傳非 JSON
    msg.className   = 'msg-box error';
    msg.textContent = '⚠️ 提交失敗，請稍後再試或聯絡福委群。';
    btn.disabled    = false;
    btn.textContent = '確認報名';
  }
}

// ================================================================
// Init
// ================================================================
renderAll();
fetchCounts();
setInterval(fetchCounts, 10000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') fetchCounts();
});
</script>
