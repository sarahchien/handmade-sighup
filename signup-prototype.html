<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>福委會活動報名</title>
  <style>
    :root {
      --bg:        #fdf8dc;
      --card:      #fffef4;
      --border:    #e8dfa8;
      --text:      #3a3020;
      --text-light:#9a8860;
      --input-bg:  #fffef8;
      --success:   #3a7040;
      --success-bg:#eef6e8;
      --error:     #b83030;
      --error-bg:  #fdf0f0;

      --c-cal:     #4a7a3a;
      --c-cal-bg:  #eef6e8;
      --c-cake:    #c0604a;
      --c-cake-bg: #fdf2ee;
      --c-esc:     #5a4890;
      --c-esc-bg:  #f0edf8;
    }

    html { font-size: 18px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px 64px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .page-header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .page-header p { color: #888; font-size: 0.88rem; }

    .form-card {
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(0,0,0,.07);
      padding: 28px 24px;
      width: 100%;
      max-width: 640px;
      margin-bottom: 14px;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #aaa;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    /* ── Activity section ── */
    .activity-section { margin-bottom: 22px; }
    .activity-section:last-child { margin-bottom: 0; }

    .act-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      padding-bottom: 9px;
      margin-bottom: 12px;
      border-bottom: 2px solid;
    }
    .act-header.cal  { color: var(--c-cal);  border-color: var(--c-cal); }
    .act-header.cake { color: var(--c-cake); border-color: var(--c-cake); }
    .act-header.esc  { color: var(--c-esc);  border-color: var(--c-esc); }
    .act-icon-sm { font-size: 1.1rem; }

    /* ── Slot grid ── */
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .slot-card {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .slot-card.full { opacity: .45; cursor: not-allowed; }
    .slot-card.selected {
      border-color: var(--slot-color);
      background: var(--slot-bg);
    }
    .slot-card:not(.full):hover { border-color: var(--slot-color); }

    .slot-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 3px;
    }
    .slot-datetime {
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 10px;
    }
    .slot-quota {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      color: #666;
    }
    .quota-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #55b872;
      flex-shrink: 0;
    }
    .quota-dot.full { background: #e07070; }

    /* ── Form fields ── */
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .field-group { margin-bottom: 14px; }
    .field-group:last-child { margin-bottom: 0; }

    label.field-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
    }
    label.field-label .req { color: #c03030; margin-left: 2px; }

    input[type=text], select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: inherit;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: #aaa; }
    input::placeholder, textarea::placeholder { color: #bbb; }
    textarea { resize: vertical; min-height: 68px; }

    .submit-btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .18s;
      letter-spacing: .01em;
    }
    .submit-btn:disabled { opacity: .35; cursor: not-allowed; }
    .submit-btn:not(:disabled):hover { opacity: .8; }

    .msg-box {
      display: none;
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 9px;
      font-size: 0.87rem;
      line-height: 1.5;
    }
    .msg-box.success { display: block; background: var(--success-bg); color: var(--success); }
    .msg-box.error   { display: block; background: var(--error-bg);   color: var(--error); }

    .page-footer {
      font-size: 0.78rem;
      color: #aaa;
      text-align: center;
      max-width: 640px;
    }

    @media (max-width: 500px) {
      .field-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 380px) {
      .form-card { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <h1>福委會活動報名</h1>
  <p>每人限報一個活動一個梯次 · 先報先得</p>
</div>

<div class="form-card">

  <!-- ① 選擇梯次 -->
  <div class="section-label">① 選擇梯次</div>
  <div id="allSlotsContainer">
    <!-- rendered by JS -->
  </div>

  <hr class="divider">

  <!-- ② 填寫資料 -->
  <div class="section-label">② 填寫資料</div>
  <form id="signupForm" onsubmit="handleSubmit(event)">

    <div class="field-row">
      <div class="field-group">
        <label class="field-label" for="name">姓名 <span class="req">*</span></label>
        <input type="text" id="name" placeholder="請輸入全名" required>
      </div>
      <div class="field-group">
        <label class="field-label" for="empId">員工編號 <span class="req">*</span></label>
        <input type="text" id="empId" placeholder="請輸入員工編號" required>
      </div>
    </div>

    <div class="field-row" id="divDeptRow">
      <div class="field-group">
        <label class="field-label" for="division">事業處 <span class="req">*</span></label>
        <select id="division" required onchange="updateDept()">
          <option value="">— 請選擇 —</option>
          <option>銀行事業處</option>
          <option>系統整合處</option>
          <option>技術研發處</option>
          <option>行政管理處</option>
          <option>企業事業處</option>
        </select>
      </div>
      <div class="field-group" id="deptGroup">
        <label class="field-label" for="department">部門 <span class="req">*</span></label>
        <select id="department" required>
          <option value="">— 請先選事業處 —</option>
        </select>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label" for="note">備註</label>
      <textarea id="note" placeholder="如有特殊需求請填寫（選填）"></textarea>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn" disabled>請先選擇梯次</button>
  </form>

  <div class="msg-box" id="msgBox"></div>
</div>

<div class="page-footer">
  <p style="margin-bottom:6px;">注意事項</p>
  <p>· 額滿梯次將顯示「額滿」並關閉選擇</p>
  <p>· 如需取消或更改梯次，請聯繫福委群</p>
</div>

<script>
// ================================================================
// ⚙️  Config
// ================================================================
const POST_URL = 'https://default71f032078cd347c2bc88ec47bf164d.43.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/4e4f1306bfaa41be95b3a2f3304f40d4/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GgpZ-c1cIfUfOQ5-xdikySFw-DkE-Ku6IDKTLc2lHnU';
const GET_URL  = 'https://default71f032078cd347c2bc88ec47bf164d.43.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/996f6c1e92ee4ec48485d0a9414e840c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=t8p4V9ion384gMRTS-2p6GIzmbnHAkbL9q6smGPdrfY';

const ACTIVITIES = {
  calligraphy: {
    name:       '己書藝術',
    icon:       '🖌️',
    cssClass:   'cal',
    slotColor:  'var(--c-cal)',
    slotBg:     'var(--c-cal-bg)',
    maxPerSlot: 3,
    slots: [
      { id: 'c1', name: '梯次一', date: '7/5',  time: '14:00', weekday: '(日)' },
      { id: 'c2', name: '梯次二', date: '7/12', time: '14:00', weekday: '(日)' },
    ],
  },
  cake: {
    name:       'DIY手作蛋糕',
    icon:       '🎂',
    cssClass:   'cake',
    slotColor:  'var(--c-cake)',
    slotBg:     'var(--c-cake-bg)',
    maxPerSlot: 4,
    slots: [
      { id: 'k1', name: '梯次一', date: '7/19', time: '14:00', weekday: '(日)' },
      { id: 'k2', name: '梯次二', date: '7/26', time: '14:00', weekday: '(日)' },
    ],
  },
  escape: {
    name:       '密室逃脫',
    icon:       '🔐',
    cssClass:   'esc',
    slotColor:  'var(--c-esc)',
    slotBg:     'var(--c-esc-bg)',
    maxPerSlot: 4,
    slots: [
      { id: 'e1', name: '梯次一', date: '8/1', time: '14:00', weekday: '(六)' },
      { id: 'e2', name: '梯次二', date: '8/8', time: '14:00', weekday: '(六)' },
    ],
  },
};

const DEPT_MAP = {
  '銀行事業處': ['業務發展部', '數位支付部', '網路事業部', '應用發展部', '海外金融部'],
  '系統整合處': ['業務一部', '技術支援部'],
  '技術研發處': [],
  '行政管理處': [],
  '企業事業處': ['電子商務部', '永續發展部', '流通事業部', '保險科技部', '數據加值部', '事業推展部'],
};

// ================================================================
// State
// ================================================================
let selectedActivity = null;
let selectedSlot     = null;
let quotaCounts      = {};

// slot label: '梯次一 7/5 14:00 (日)'
function slotLabel(slot) {
  return `${slot.name} ${slot.date} ${slot.time} ${slot.weekday}`;
}

// ================================================================
// Render all activities + slots
// ================================================================
function renderAll() {
  const container = document.getElementById('allSlotsContainer');
  container.innerHTML = Object.entries(ACTIVITIES).map(([actKey, act]) => `
    <div class="activity-section">
      <div class="act-header ${act.cssClass}">
        <span class="act-icon-sm">${act.icon}</span>${act.name}
      </div>
      <div class="slots-grid" style="--slot-color:${act.slotColor};--slot-bg:${act.slotBg};">
        ${act.slots.map(slot => {
          const label     = slotLabel(slot);
          const count     = quotaCounts[label] || 0;
          const remaining = act.maxPerSlot - count;
          const isFull    = remaining <= 0;
          const isChosen  = selectedSlot === label;
          return `
            <label class="slot-card${isFull ? ' full' : ''}${isChosen ? ' selected' : ''}"
                   onclick="${isFull ? '' : `pickSlot(this,'${actKey}','${label}')`}">
              <div class="slot-name">${slot.name}</div>
              <div class="slot-datetime">${slot.date} ${slot.time} ${slot.weekday}</div>
              <div class="slot-quota">
                <span class="quota-dot${isFull ? ' full' : ''}"></span>
                ${isFull ? '名額已滿' : `剩餘 ${remaining} 名`}
              </div>
            </label>`;
        }).join('')}
      </div>
    </div>`
  ).join('');
}

function pickSlot(el, actKey, label) {
  document.querySelectorAll('.slot-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedActivity = actKey;
  selectedSlot     = label;
  updateSubmitBtn();
}

// ================================================================
// Submit button state
// ================================================================
function updateSubmitBtn() {
  const btn = document.getElementById('submitBtn');
  if (!selectedSlot) {
    btn.disabled    = true;
    btn.textContent = '請先選擇梯次';
  } else {
    btn.disabled    = false;
    btn.textContent = '確認報名';
  }
}

// ================================================================
// Dept map
// ================================================================
function updateDept() {
  const div   = document.getElementById('division').value;
  const depts = DEPT_MAP[div] || [];
  const dep   = document.getElementById('department');
  const grp   = document.getElementById('deptGroup');
  const row   = document.getElementById('divDeptRow');

  if (depts.length) {
    dep.innerHTML = '<option value="">— 請選擇部門 —</option>'
      + depts.map(d => `<option>${d}</option>`).join('');
    dep.required = true;
    grp.style.display = '';
    row.style.gridTemplateColumns = '';
  } else {
    dep.innerHTML = '<option value=""></option>';
    dep.required  = false;
    grp.style.display = 'none';
    row.style.gridTemplateColumns = '1fr';
  }
}

// ================================================================
// fetchCounts — silent background polling
// ================================================================
async function fetchCounts() {
  try {
    const res  = await fetch(GET_URL + '&_t=' + Date.now(), { method: 'POST' });
    const json = await res.json();
    if (JSON.stringify(json) !== JSON.stringify(quotaCounts)) {
      quotaCounts = json;
      renderAll();
    }
  } catch { /* silent */ }
}

// ================================================================
// Submit
// ================================================================
async function handleSubmit(e) {
  e.preventDefault();
  if (!selectedActivity || !selectedSlot) return;

  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msgBox');
  msg.className   = 'msg-box';
  btn.disabled    = true;
  btn.textContent = '送出中…';

  try {
    const res = await fetch(POST_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        activity:   ACTIVITIES[selectedActivity].name,
        slot:       selectedSlot,
        name:       document.getElementById('name').value.trim(),
        empId:      document.getElementById('empId').value.trim(),
        division:   document.getElementById('division').value,
        department: document.getElementById('department').value,
        note:       document.getElementById('note').value.trim(),
      }),
    });

    const data = await res.json();

    if (data.status === 'ok') {
      msg.className   = 'msg-box success';
      msg.textContent = `✅ 報名成功！已登記「${ACTIVITIES[selectedActivity].name} — ${selectedSlot}」`;
      e.target.reset();
      selectedActivity = null;
      selectedSlot     = null;
      renderAll();
      updateSubmitBtn();
      fetchCounts();
    } else if (data.status === 'duplicate') {
      msg.className   = 'msg-box error';
      msg.textContent = '⚠️ 此員工編號已提交報名登記，不可重複報名，若有疑問請洽福委群。';
      btn.disabled    = false;
      btn.textContent = '確認報名';
    } else {
      throw new Error();
    }
  } catch {
    msg.className   = 'msg-box error';
    msg.textContent = '⚠️ 此員工編號已提交報名登記，不可重複報名，若有疑問請洽福委群。';
    btn.disabled    = false;
    btn.textContent = '確認報名';
  }
}

// ================================================================
// Init
// ================================================================
renderAll();
fetchCounts();
setInterval(fetchCounts, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') fetchCounts();
});
</script>

</body>
</html>
